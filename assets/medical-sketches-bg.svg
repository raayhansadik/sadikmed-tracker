<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <!-- Minimalist Sparse Medical Sketches Pattern (600x600 Tile - 5 Clean Elements) -->
  <defs>
    <style>
      .sk { stroke: #013E43; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .sk-acc { stroke: #00A889; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .sk-thin { stroke: #013E43; stroke-width: 1.0; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 1. Sleek Capsule Pill (Top-Left, x:120, y:110) -->
  <g transform="translate(120, 110) rotate(32)">
    <rect x="0" y="0" width="38" height="17" rx="8.5" class="sk"/>
    <line x1="19" y1="0" x2="19" y2="17" class="sk-acc" stroke-dasharray="2 2"/>
    <path d="M5 4 Q12 2 17 4" class="sk-thin"/>
    <line x1="23" y1="4" x2="28" y2="13" class="sk-thin"/>
    <line x1="28" y1="4" x2="33" y2="13" class="sk-thin"/>
  </g>

  <!-- 2. Heartbeat ECG Rhythm with Heart Contour (Top-Right, x:430, y:120) -->
  <g transform="translate(430, 120)">
    <path d="M0 20 L16 20 L20 14 L24 26 L29 4 L35 36 L41 16 L45 22 L51 20 L72 20" class="sk"/>
    <path d="M29 8 C26 1 16 1 16 11 C16 19 29 27 29 27 C29 27 42 19 42 11 C42 1 32 1 29 8 Z" class="sk-acc" stroke-dasharray="2.5 2.5"/>
  </g>

  <!-- 3. Clean Scored Tablet (Center, x:285, y:285) -->
  <g transform="translate(285, 285) rotate(-15)">
    <circle cx="16" cy="16" r="14" class="sk"/>
    <circle cx="16" cy="16" r="10.5" class="sk-thin"/>
    <line x1="6" y1="10" x2="26" y2="22" class="sk-acc" stroke-width="1.6"/>
  </g>

  <!-- 4. Medicine Bottle with Cross (Bottom-Left, x:130, y:450) -->
  <g transform="translate(130, 450) rotate(-6)">
    <rect x="10" y="2" width="16" height="6" rx="2" class="sk"/>
    <line x1="13" y1="2" x2="13" y2="8" class="sk-thin"/>
    <line x1="16" y1="2" x2="16" y2="8" class="sk-thin"/>
    <line x1="19" y1="2" x2="19" y2="8" class="sk-thin"/>
    <line x1="22" y1="2" x2="22" y2="8" class="sk-thin"/>
    <path d="M13 8 V11 H23 V8" class="sk"/>
    <path d="M10 11 Q5 14 5 20 V44 Q5 48 10 48 H26 Q31 48 31 44 V20 Q31 14 26 11 Z" class="sk"/>
    <rect x="9" y="19" width="18" height="20" rx="2.5" class="sk-acc"/>
    <path d="M18 24 V32 M14 28 H22" class="sk-acc" stroke-width="1.6"/>
  </g>

  <!-- 5. DNA Double Helix (Bottom-Right, x:430, y:460) -->
  <g transform="translate(430, 460) rotate(18)">
    <path d="M0 10 Q12 -3 24 10 T48 10 T72 10" class="sk"/>
    <path d="M0 10 Q12 23 24 10 T48 10 T72 10" class="sk-acc"/>
    <line x1="6" y1="3" x2="6" y2="17" class="sk-thin"/>
    <line x1="18" y1="3" x2="18" y2="17" class="sk-thin"/>
    <line x1="30" y1="3" x2="30" y2="17" class="sk-thin"/>
    <line x1="42" y1="3" x2="42" y2="17" class="sk-thin"/>
    <line x1="54" y1="3" x2="54" y2="17" class="sk-thin"/>
    <line x1="66" y1="3" x2="66" y2="17" class="sk-thin"/>
  </g>
</svg>
